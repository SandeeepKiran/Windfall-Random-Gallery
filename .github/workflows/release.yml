name: Release signed APK

# Push a tag like v1.1.0 and this builds a signed release APK and attaches it to a GitHub Release.
on:
  push:
    tags:
      - "v*"

# Write access is needed only to create the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build doesn't need the repo token; don't leave it on disk next to it.
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Before the keystore exists on disk.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # The keystore is stored as a base64 GitHub secret, never in the repo.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WINDFALL_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/windfall-release.jks"

      - name: Build signed release APK
        env:
          WINDFALL_KEYSTORE: ${{ runner.temp }}/windfall-release.jks
          WINDFALL_KEYSTORE_PASSWORD: ${{ secrets.WINDFALL_KEYSTORE_PASSWORD }}
          WINDFALL_KEY_ALIAS: windfall
          WINDFALL_KEY_PASSWORD: ${{ secrets.WINDFALL_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Windfall-${GITHUB_REF_NAME}.apk"

      # Gone before any third-party step runs, even if the build failed.
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/windfall-release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Windfall ${{ github.ref_name }}
          generate_release_notes: true
          files: Windfall-${{ github.ref_name }}.apk
