<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:80px 40px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px">
  <div style="width:120px;height:120px;border-radius:60px;background:var(--sc-high);display:grid;place-items:center;position:relative">
    <span style="font-family:'Material Symbols Rounded';font-size:60px;color:var(--outline)">folder_off</span>
  </div>
  <div style="font-size:19px;font-weight:500;color:var(--on-surface)">No source folders selected</div>
  <div style="font-size:14px;color:var(--on-surface-variant);line-height:1.5;max-width:250px">Pick at least one folder to start seeing your photos here at random.</div>
  <button onClick="{{ onSelect }}" style="height:48px;padding:0 26px;border:none;background:var(--primary);color:var(--on-primary);border-radius:24px;font-family:Roboto;font-size:14px;font-weight:500;cursor:pointer;margin-top:6px;display:flex;align-items:center;gap:8px">
    <span style="font-family:'Material Symbols Rounded';font-size:20px">create_new_folder</span>Choose folders
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:420},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
